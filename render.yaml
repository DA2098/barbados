services:
  - type: web
    name: barbados-frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://barbados-api.onrender.com/api
    routes:
      - path: /
        index: dist/index.html
    staticSite: true
    buildDir: dist
    rootDir: .

  - type: web
    name: barbados-api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
    port: 3000
    rootDir: backend

databases:
  - name: barbados-db
    plan: free
    provider: postgresql
